name: Request an enhancement
description: Suggest a capability, workflow, or documentation improvement.
title: "[Enhancement]: "
labels:
  - enhancement
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - audit-frontend-designer-konvert
        - create-frontend-from-zero-konvert
        - design-por-referencia-konvert
        - Documentation or community files
        - New component
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: Need
      description: What task or problem motivated this request?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the desired behavior and how it could be verified.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: impact
    attributes:
      label: Impact and compatibility
      description: Identify contracts, examples, or workflows that may be affected.
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched for similar requests in existing issues.
          required: true
        - label: This proposal does not depend on private data or unauthorized third-party content.
          required: true
