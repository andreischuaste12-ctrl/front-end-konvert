name: Report a bug
description: Report incorrect behavior or a reproducible failure.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve Front-end Konvert. Do not include credentials or personal data.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - audit-frontend-designer-konvert
        - create-frontend-from-zero-konvert
        - design-por-referencia-konvert
        - Documentation or community files
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain what happened and why the result appears incorrect.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use a minimal example and synthetic data.
      placeholder: |
        1. Run...
        2. Provide...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, and agent when applicable.
  - type: textarea
    id: evidence
    attributes:
      label: Reviewed evidence
      description: Include logs or images only after removing private information.
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched for existing issues about the same problem.
          required: true
        - label: I removed credentials and personal data from this report.
          required: true
